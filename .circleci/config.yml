version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.87"

orbs:
  toolkit: jerus-org/circleci-toolkit@8.0.1

workflows:
  validation:
    jobs:
      # Signature verification for trusted PRs (with write access for comments)
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/
      # Signature verification for forked PRs (read-only, no comments)
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only: /pull\/[0-9]+/
      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>
      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main
      - toolkit/test_doc_build:
          filters:
            branches:
              ignore: main
      # No branch filter: "security with sonarcloud" runs on main and
      # requires this job for its clippy_report. CircleCI does not run a job
      # whose `requires` dependency was itself filtered out on that branch,
      # so filtering this to ignore: main would silently skip sonarcloud on
      # main entirely (jerus-org/nextsv#517).
      - toolkit/idiomatic_rust:
          clippy_report: true
      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>
      # security audit only: runs on forked PRs (no secrets exposure) and main
      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/
      # security with sonarcloud: runs on trusted feature branches only
      # toolkit/security defaults no_sonarcloud_on_main: true (skip the
      # sonarcloud step on main) — override it here or main never actually
      # gets scanned despite this job's name and branch filter.
      - toolkit/security:
          name: security with sonarcloud
          context: SonarCloud
          no_sonarcloud_on_main: false
          clippy_report: true
          requires:
            - toolkit/idiomatic_rust
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
      - toolkit/code_coverage:
          package: nextsv
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
                - main
          requires:
            - security with sonarcloud
