[package]
name = "nextsv"
version = "0.19.34"
edition.workspace = true
authors = ["jerusdp <jrussell@jerus.ie>"]
rust-version.workspace = true
description = "Next semantic version calculator"
license = "MIT"
readme = "README.md"
repository.workspace = true
keywords = ["semantic", "version", "calculator"]
include = ["**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGES.md"]
publish = true

[dependencies]
cargo_toml.workspace = true
clap.workspace = true
clap-verbosity-flag.workspace = true
color-eyre = "0.6.5"
colored.workspace = true
env_logger.workspace = true
git-conventional.workspace = true
git2.workspace = true
log.workspace = true
proc-exit.workspace = true
regex.workspace = true
thiserror.workspace = true

[dev-dependencies]
map-macro.workspace = true
rstest.workspace = true
snapbox.workspace = true
test_utils = { path = "../test-utils" }
trycmd.workspace = true

[lib]
name = "nextsv"
path = "src/lib.rs"

[[bin]]
name = "nextsv"
path = "src/main.rs"

[build-dependencies]
autocfg.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/nextsv-v{ version }/nextsv-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall signature verification. The pubkey is a placeholder in source:
# the release pipeline generates an ephemeral minisign/rsign keypair, signs the
# tarball, and `pcu release inject-pubkey` replaces the `pubkey` value below with
# that release's public key before the crate is published. Without this section
# pcu has nothing to replace and the signature is published unverifiable.
# See docs/RELEASING.md.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWQZhx7+vwMObfwEdMiwRYmSrE+9KRASo4+3YqdEEPA3ODUR+RcnVFPS"
